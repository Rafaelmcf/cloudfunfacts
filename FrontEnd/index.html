<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudFunFacts</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 20px;
      width: 600px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      background: #3b82f6;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    button:hover {
      background: #2563eb;
    }

    #fact {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>☁️ CloudFunFacts</h1>

    <button onclick="getFact()">
      Gerar curiosidade
    </button>

    <p id="fact">
      Clique no botão para gerar uma curiosidade.
    </p>
  </div>

  <script>
    async function getFact() {

      const response = await fetch("https://nv56qgweyj.execute-api.us-east-1.amazonaws.com/prod/funfact");

      const data = await response.json();

      document.getElementById("fact").innerText = data.fact;
    }
  </script>

</body>
</html>
